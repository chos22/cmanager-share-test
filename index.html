<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="카드관리"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style-family-v15.css"><title>신용카드 관리</title></head><body>
<div id="app" class="app"><header class="top"><div><div class="eyebrow">▣ MY CARD</div><h1>신용카드 관리</h1><p id="current-month"></p></div><div class="head-buttons"><button class="iconbtn" id="shared-open" aria-label="부부 공유 설정">⇄</button><button class="iconbtn" id="backup-open" aria-label="백업 및 복원">☁</button><button class="iconbtn" id="history-open" aria-label="월별 기록">▦</button></div></header>
<p id="sync-status" class="sync-status">부부 공유 연결 전 · ⇄ 버튼에서 로그인</p><section class="hero"><p>✦ 이번 달 목표 실적까지</p><strong id="total-remaining">0원</strong><p class="muted-light">내 카드와 와이프 카드의 남은 목표 실적 합계</p><div class="owner-summary"><div class="owner-summary-item"><span><i class="owner-dot mine"></i>내 카드 <small id="mine-count">0개</small></span><b id="mine-remaining">0원</b></div><div class="owner-summary-item"><span><i class="owner-dot wife"></i>와이프 카드 <small id="wife-count">0개</small></span><b id="wife-remaining">0원</b></div></div><hr><div class="metrics"><span>▣ 등록 카드 <b id="card-count">0개</b></span><span>✓ 실적 달성 <b id="card-achieved">0 / 0</b></span></div></section>
<div id="due-banner" class="due-banner" hidden></div><nav class="owner-tabs" aria-label="카드 소유자 필터"><button type="button" class="owner-tab active" data-owner-filter="all" aria-pressed="true">전체</button><button type="button" class="owner-tab" data-owner-filter="mine" aria-pressed="false">내 카드</button><button type="button" class="owner-tab" data-owner-filter="wife" aria-pressed="false">와이프 카드</button></nav><div class="sectiontitle"><div class="section-heading"><h2>보유 카드</h2><p>카드를 눌러 인정 실적과 남은 혜택을 입력하세요</p></div><div class="section-buttons"><button class="primary small" type="button" id="add-card">＋ 카드 추가</button></div></div><main id="cards"></main><p class="hint">카드를 길게 누르면 이름 수정·순서 변경 메뉴가 열려요. <span class="version-label">공유 테스트 v15</span></p></div>
<div id="modal" class="modal" hidden><div class="shade" data-close></div><section class="sheet" role="dialog" aria-modal="true"><header class="sheet-head"><h2 id="sheet-title"></h2><button class="iconbtn" data-close aria-label="닫기">✕</button></header><div id="sheet-body"></div></section></div>
<script src="./app-family-v15.js" defer></script></body></html>
